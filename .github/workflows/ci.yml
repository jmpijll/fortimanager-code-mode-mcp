name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # Keep the Node 22 check name used by existing branch protection.
    name: ${{ matrix.node == 22 && 'Lint & Format' || format('Lint & Format ({0})', matrix.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: ${{ matrix.node == 22 && 'Type Check' || format('Type Check ({0})', matrix.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: ${{ matrix.node == 22 && 'Tests' || format('Tests ({0})', matrix.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: ${{ matrix.node == 22 && 'Build' || format('Build ({0})', matrix.node) }}
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    # Proves the Dockerfile builds on a clean checkout (no src/spec) and that
    # the image starts and answers MCP requests with a spec mounted at runtime.
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fmg-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations are only exported when pushing to a registry.
          provenance: false
          sbom: false
      - name: Smoke test image
        run: ./scripts/docker-smoke.sh fmg-mcp:ci

  pack-smoke:
    # Drives the packed tarball through the MCP handshake and an isolated npx
    # resolution check. release.yml reuses this workflow, so packaging
    # regressions fail the release before anything is published.
    name: Package Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./scripts/pack-smoke.sh
