name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION="${{ steps.version.outputs.version }}"
          
          # Use awk to extract the section between this version header and the next
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found && /^---$/ { next }
            found { print }
          ' CHANGELOG.md)
          
          # Fallback to git log if CHANGELOG section not found
          if [ -z "$NOTES" ]; then
            TAG="${{ steps.version.outputs.tag }}"
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "$TAG" | head -1)
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG".."$TAG")
            else
              NOTES=$(git log --pretty=format:"- %s (%h)" "$TAG")
            fi
          fi
          
          # Write to output using delimiter
          {
            echo "notes<<RELEASE_EOF"
            echo "$NOTES"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Determine pre-release status
        id: prerelease
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          if [ "$MAJOR" = "0" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "suffix= (Pre-release)" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}${{ steps.prerelease.outputs.suffix }}
          body: |
            ${{ steps.notes.outputs.notes }}

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/...
            
            > **Note**: This server requires locally-generated API spec files. See [README](https://github.com/${{ github.repository }}#important-api-spec-required) for setup instructions.
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: false

  npm-publish:
    # Runs alongside `release` (both only need `ci`): the GitHub Release, the npm
    # package and the GHCR image are independent artifacts of the same tag, so a
    # failure in one does not block the others. The version guard below keeps
    # them consistent.
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [ci]
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC), no NPM_TOKEN secret needed.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Tag v${TAG_VERSION} matches package.json version"

      - run: npm ci

      - run: npm run build

      - name: Publish to npm
        # Trusted publishing needs npm CLI >= 11.5.1, which Node 22's bundled npm
        # is not. Use an ephemeral npm 11 for this step only, so the repo
        # toolchain stays on the Node 22 defaults.
        run: npx -y npm@^11.5.1 publish --provenance --access public

  ghcr:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    needs: [ci]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Required by buildx for signed provenance attestations (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jmpijll/fortimanager-code-mode-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=FortiManager Code Mode MCP Server
            org.opencontainers.image.description=FortiManager Code Mode MCP Server (search + execute tools, QuickJS WASM sandbox)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/jmpijll/fortimanager-code-mode-mcp
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
